name: Build Rootless & Rootful .deb

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Rootless & Rootful .deb
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos, Linux Toolchain & iOS SDKs
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot git perl clang lldb lld make curl unzip xz-utils zip libxml2 libxml2-dev libssl-dev zlib1g-dev
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          rm -rf "$THEOS/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$THEOS/sdks"

      - name: Build Rootless Package (iOS 15 - 16.3.1+)
        run: |
          export THEOS=$HOME/theos
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p dist/rootless
          cp packages/*.deb dist/rootless/

      - name: Build Rootful Package (iOS 14)
        run: |
          export THEOS=$HOME/theos
          make clean package FINALPACKAGE=1
          mkdir -p dist/rootful
          cp packages/*.deb dist/rootful/

      - name: Upload Rootless .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleSwitcher-Rootless-deb
          path: dist/rootless/*.deb

      - name: Upload Rootful .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleSwitcher-Rootful-deb
          path: dist/rootful/*.deb
