name: Build Rootless & Rootful .deb

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build CircleSwitcher .deb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Theos & iOS SDKs
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-sdks-v2-${{ runner.os }}

      - name: Install Theos, Linux Toolchain & iOS SDKs
        if: steps.cache-theos.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fakeroot dpkg perl git curl unzip xz-utils
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" || true
          if [ ! -d "$HOME/theos/sdks" ] || [ -z "$(ls -A $HOME/theos/sdks 2>/dev/null)" ]; then
            mkdir -p "$HOME/theos/sdks"
            curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/sdks.tar.gz
            tar -xzf /tmp/sdks.tar.gz -C /tmp
            cp -r /tmp/sdks-master/*.sdk "$HOME/theos/sdks/"
            rm -rf /tmp/sdks.tar.gz /tmp/sdks-master
          fi

      - name: Build Rootless Package (iOS 15 - 16.3.1+)
        run: |
          export THEOS=$HOME/theos
          mkdir -p artifacts/rootless
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb artifacts/rootless/

      - name: Build Rootful Package (iOS 14)
        run: |
          export THEOS=$HOME/theos
          mkdir -p artifacts/rootful
          make clean
          make package FINALPACKAGE=1
          cp packages/*.deb artifacts/rootful/

      - name: Upload Rootless .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleSwitcher-Rootless-deb
          path: artifacts/rootless/*.deb

      - name: Upload Rootful .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleSwitcher-Rootful-deb
          path: artifacts/rootful/*.deb
