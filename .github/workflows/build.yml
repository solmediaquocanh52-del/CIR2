name: Build Rootless & Rootful .deb

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build CircleSwitcher .deb
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ldid & dpkg
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ldid dpkg

      - name: Cache Theos & iOS SDKs
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-macos-sdks-v1-${{ runner.os }}

      - name: Install Theos & Patched iOS SDKs
        if: steps.cache-theos.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf "$HOME/theos"

          echo "==> Cloning Theos..."
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"

          echo "==> Downloading Patched iOS SDKs..."
          mkdir -p "$HOME/theos/sdks"
          SDK_URLS=$(gh api repos/theos/sdks/releases --jq '[.[] | select(.assets | length > 0)][0].assets[] | select(.name | test("^iPhoneOS.*\\.sdk\\.tar\\."; "i")) | .browser_download_url')
          echo "$SDK_URLS"
          test -n "$SDK_URLS"
          for url in $SDK_URLS; do
            echo "Downloading: $url"
            curl -fL "$url" -o /tmp/sdk.tar.xz
            tar -xf /tmp/sdk.tar.xz -C "$HOME/theos/sdks/"
            rm -f /tmp/sdk.tar.xz
          done

          echo "==> Verifying Theos & SDKs..."
          test -f "$HOME/theos/makefiles/common.mk"
          ls -d "$HOME/theos/sdks/"*.sdk

      - name: Build Rootless Package (iOS 15 - 16.3.1+)
        run: |
          export THEOS=$HOME/theos
          rm -rf packages artifacts/rootless
          mkdir -p artifacts/rootless
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb artifacts/rootless/

      - name: Build Rootful Package (iOS 14)
        run: |
          export THEOS=$HOME/theos
          rm -rf packages artifacts/rootful
          mkdir -p artifacts/rootful
          make clean
          make package FINALPACKAGE=1
          cp packages/*.deb artifacts/rootful/

      - name: Upload Rootless .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleSwitcher-Rootless-deb
          path: artifacts/rootless/*.deb

      - name: Upload Rootful .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleSwitcher-Rootful-deb
          path: artifacts/rootful/*.deb
